worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}


http {

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 60;
    server_tokens off;

    # USTOM LOG FORMAT (see which backend handled each request)
    log_format upstream_log '$remote_addr - $request '
                            'status=$status '
                            'upstream=$upstream_addr '
                            'response_time=${upstream_response_time}s';

    access_log /var/log/nginx/access.log upstream_log;


    # Rate Limiting Zones (per client IP)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_status 429;


    upstream backend {
        least_conn;
        server backend-1:3000 max_fails=3 fail_timeout=30s;
        server backend-2:3000 max_fails=3 fail_timeout=30s;
        server backend-3:3000 max_fails=3 fail_timeout=30s;
        server backend-4:3000 max_fails=3 fail_timeout=30s;
        server backend-5:3000 max_fails=3 fail_timeout=30s;
        server backend-6:3000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream auth_backend {
        ip_hash;
        server auth-1:3000 max_fails=3 fail_timeout=30s;
        server auth-2:3000 max_fails=3 fail_timeout=30s;
        server auth-3:3000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }


    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;

            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }


        location /auth/ {
            limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass http://auth_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;

            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }


        location ~ /\. {
            deny all;
            return 404;
        }


        location /health {
            default_type application/json;
            return 200 '{"status":"nginx is running"}';
        }
    }
}