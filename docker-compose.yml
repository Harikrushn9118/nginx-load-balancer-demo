services:

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx_1/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx_1/static:/usr/share/nginx/html:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3
      - backend-4
      - backend-5
      - backend-6
      - auth-1
      - auth-2
      - auth-3
    restart: unless-stopped
    networks:
      - app-network

  backend-1:
    build: ./backend/backend-service
    container_name: backend-1
    environment:
      - INSTANCE_ID=1
    expose:
      - "3000"
    volumes:
      - shared-data:/app/data
    restart: unless-stopped
    networks:
      - app-network

  backend-2:
    build: ./backend/backend-service
    container_name: backend-2
    environment:
      - INSTANCE_ID=2
    expose:
      - "3000"
    volumes:
      - shared-data:/app/data
    restart: unless-stopped
    networks:
      - app-network

  backend-3:
    build: ./backend/backend-service
    container_name: backend-3
    environment:
      - INSTANCE_ID=3
    expose:
      - "3000"
    volumes:
      - shared-data:/app/data
    restart: unless-stopped
    networks:
      - app-network

  backend-4:
    build: ./backend/backend-service
    container_name: backend-4
    environment:
      - INSTANCE_ID=4
    expose:
      - "3000"
    volumes:
      - shared-data:/app/data
    restart: unless-stopped
    networks:
      - app-network

  backend-5:
    build: ./backend/backend-service
    container_name: backend-5
    environment:
      - INSTANCE_ID=5
    expose:
      - "3000"
    volumes:
      - shared-data:/app/data
    restart: unless-stopped
    networks:
      - app-network

  backend-6:
    build: ./backend/backend-service
    container_name: backend-6
    environment:
      - INSTANCE_ID=6
    expose:
      - "3000"
    volumes:
      - shared-data:/app/data
    restart: unless-stopped
    networks:
      - app-network

  auth-1:
    build: ./backend/auth-service
    container_name: auth-1
    environment:
      - INSTANCE_ID=1
    expose:
      - "3000"
    volumes:
      - shared-data:/app/data
    restart: unless-stopped
    networks:
      - app-network

  auth-2:
    build: ./backend/auth-service
    container_name: auth-2
    environment:
      - INSTANCE_ID=2
    expose:
      - "3000"
    volumes:
      - shared-data:/app/data
    restart: unless-stopped
    networks:
      - app-network

  auth-3:
    build: ./backend/auth-service
    container_name: auth-3
    environment:
      - INSTANCE_ID=3
    expose:
      - "3000"
    volumes:
      - shared-data:/app/data
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  shared-data:
